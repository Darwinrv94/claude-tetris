<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" type="button" aria-pressed="false" aria-label="Cambiar a modo claro">Modo claro</button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <div id="gameover-records" class="records hidden">
            <div id="gameover-stats" class="records-stats"></div>
            <form id="name-form" class="name-form hidden">
              <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" aria-label="Nombre para el récord" />
              <button type="submit" class="records-btn">Guardar</button>
            </form>
            <table class="records-table">
              <thead><tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Lín.</th><th>Niv.</th></tr></thead>
              <tbody id="gameover-table"></tbody>
            </table>
          </div>
          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>

      <div id="start-screen" class="overlay hidden">
        <div class="overlay-box records">
          <p class="start-title">RECORDS</p>
          <table class="records-table">
            <thead><tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Lín.</th><th>Niv.</th></tr></thead>
            <tbody id="start-table"></tbody>
          </table>
          <div class="records-stats">
            <p>Mejor combo: <span id="start-best-combo">0</span></p>
            <p>Líneas máximas: <span id="start-max-lines">0</span></p>
          </div>
          <button id="play-btn" type="button" class="records-btn">Jugar</button>
          <button id="clear-records-btn" type="button" class="records-btn secondary">Borrar records</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
